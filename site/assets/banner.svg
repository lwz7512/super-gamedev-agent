<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Super Gamedev Agent</title>
  <desc id="d">A Claude Code game studio in seven layers: studio and knowledge at the base, then run-and-verify, asset production, playtest data, the studio vault and evals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1226"/>
      <stop offset="0.55" stop-color="#1b1640"/>
      <stop offset="1" stop-color="#2a1236"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#ff6b8b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <g fill="#ffffff">
    <rect x="96" y="56" width="4" height="4" opacity="0.5"/>
    <rect x="610" y="44" width="4" height="4" opacity="0.35"/>
    <rect x="40" y="330" width="4" height="4" opacity="0.3"/>
    <rect x="700" y="356" width="4" height="4" opacity="0.3"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="118" fill="#ffb547" font-size="20" font-weight="600" letter-spacing="4">CLAUDE CODE · GAME DEVELOPMENT</text>
    <text x="70" y="192" fill="#ffffff" font-size="68" font-weight="800" letter-spacing="-1">Super Gamedev</text>
    <text x="70" y="262" fill="url(#accent)" font-size="68" font-weight="800" letter-spacing="-1">Agent</text>
    <text x="72" y="314" fill="#c9c6e8" font-size="22">A game studio of AI agents, in seven layers.</text>
    <text x="72" y="346" fill="#8f8bb8" font-size="17">Plays the game · makes the assets · learns from playtests · remembers</text>
  </g>

  <!-- the layer stack: foundations at the bottom -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <g transform="translate(790 40)">
      <rect width="420" height="38" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#a996ff" stroke-opacity="0.65"/>
      <rect x="0" y="0" width="7" height="38" rx="3" fill="#a996ff"/>
      <text x="22" y="25" fill="#ffffff" font-size="16" font-weight="700">Evals</text>
      <text x="170" y="25" fill="#c9c6e8" font-size="14">is it still one system?</text>
    </g>
    <g transform="translate(790 84)">
      <rect width="420" height="38" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#f0c46a" stroke-opacity="0.65"/>
      <rect x="0" y="0" width="7" height="38" rx="3" fill="#f0c46a"/>
      <text x="22" y="25" fill="#ffffff" font-size="16" font-weight="700">Studio vault</text>
      <text x="170" y="25" fill="#c9c6e8" font-size="14">modules and lessons across games</text>
    </g>
    <g transform="translate(790 128)">
      <rect width="420" height="38" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#7cc0f2" stroke-opacity="0.65"/>
      <rect x="0" y="0" width="7" height="38" rx="3" fill="#7cc0f2"/>
      <text x="22" y="25" fill="#ffffff" font-size="16" font-weight="700">Playtest data</text>
      <text x="170" y="25" fill="#c9c6e8" font-size="14">telemetry, bots, reports</text>
    </g>
    <g transform="translate(790 172)">
      <rect width="420" height="38" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#d99cf0" stroke-opacity="0.65"/>
      <rect x="0" y="0" width="7" height="38" rx="3" fill="#d99cf0"/>
      <text x="22" y="25" fill="#ffffff" font-size="16" font-weight="700">Asset production</text>
      <text x="170" y="25" fill="#c9c6e8" font-size="14">art and sound, checked, licensed</text>
    </g>
    <g transform="translate(790 216)">
      <rect width="420" height="38" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#5fd49c" stroke-opacity="0.65"/>
      <rect x="0" y="0" width="7" height="38" rx="3" fill="#5fd49c"/>
      <text x="22" y="25" fill="#ffffff" font-size="16" font-weight="700">Run-and-verify</text>
      <text x="170" y="25" fill="#c9c6e8" font-size="14">agents play the game</text>
    </g>
    <line x1="790" y1="260" x2="1210" y2="260" stroke="#ffffff" stroke-opacity="0.18" stroke-dasharray="4 6"/>
    <g transform="translate(790 266)">
      <rect width="420" height="40" rx="9" fill="#ffffff" fill-opacity="0.09" stroke="#ff6b8b" stroke-opacity="0.8" stroke-width="1.5"/>
      <rect x="0" y="0" width="7" height="40" rx="3" fill="#ff6b8b"/>
      <text x="22" y="26" fill="#ffffff" font-size="16" font-weight="700">Knowledge</text>
      <text x="170" y="26" fill="#c9c6e8" font-size="14">79 skills · 12 engines</text>
    </g>
    <g transform="translate(790 312)">
      <rect width="420" height="40" rx="9" fill="#ffffff" fill-opacity="0.09" stroke="#ffb547" stroke-opacity="0.8" stroke-width="1.5"/>
      <rect x="0" y="0" width="7" height="40" rx="3" fill="#ffb547"/>
      <text x="22" y="26" fill="#ffffff" font-size="16" font-weight="700">Studio</text>
      <text x="170" y="26" fill="#c9c6e8" font-size="14">49 agents · 80 workflows</text>
    </g>
  </g>
</svg>
