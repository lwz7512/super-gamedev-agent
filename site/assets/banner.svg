<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Super Gamedev Agent</title>
  <desc id="d">A Claude Code game studio: 49 role agents and 75 workflow skills, backed by a 79-skill knowledge library across 12 engines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1226"/>
      <stop offset="0.55" stop-color="#1b1640"/>
      <stop offset="1" stop-color="#2a1236"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#ff6b8b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- pixel sparkles -->
  <g fill="#ffffff">
    <rect x="96" y="56" width="4" height="4" opacity="0.5"/>
    <rect x="610" y="44" width="4" height="4" opacity="0.35"/>
    <rect x="1196" y="70" width="4" height="4" opacity="0.5"/>
    <rect x="700" y="352" width="4" height="4" opacity="0.3"/>
    <rect x="1220" y="340" width="4" height="4" opacity="0.4"/>
    <rect x="40" y="330" width="4" height="4" opacity="0.3"/>
  </g>

  <!-- title block -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="118" fill="#ffb547" font-size="20" font-weight="600" letter-spacing="4">CLAUDE CODE · GAME DEVELOPMENT</text>
    <text x="70" y="192" fill="#ffffff" font-size="68" font-weight="800" letter-spacing="-1">Super Gamedev</text>
    <text x="70" y="262" fill="url(#accent)" font-size="68" font-weight="800" letter-spacing="-1">Agent</text>
    <text x="72" y="314" fill="#c9c6e8" font-size="22">A game studio of AI agents that knows your engine.</text>
    <text x="72" y="346" fill="#8f8bb8" font-size="17">Godot · Unity · Unreal · Phaser · PixiJS · three.js · Ebitengine · Bevy · Defold · LÖVE · pygame · Roblox</text>
  </g>

  <!-- two-layer stack -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- studio layer -->
    <g transform="translate(800 60)">
      <rect width="400" height="118" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffb547" stroke-opacity="0.7" stroke-width="2"/>
      <text x="24" y="38" fill="#ffb547" font-size="15" font-weight="700" letter-spacing="2">STUDIO LAYER</text>
      <text x="24" y="72" fill="#ffffff" font-size="26" font-weight="700">49 agents · 80 workflows</text>
      <text x="24" y="100" fill="#c9c6e8" font-size="15">brief → prototype → stories → gates → ship</text>
      <!-- org chart pips -->
      <g fill="#ffb547">
        <rect x="352" y="22" width="12" height="12" rx="2"/>
        <rect x="334" y="44" width="10" height="10" rx="2" opacity="0.8"/>
        <rect x="352" y="44" width="10" height="10" rx="2" opacity="0.8"/>
        <rect x="370" y="44" width="10" height="10" rx="2" opacity="0.8"/>
      </g>
    </g>
    <!-- connector -->
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6">
      <line x1="900" y1="178" x2="900" y2="202"/>
      <line x1="1100" y1="178" x2="1100" y2="202"/>
    </g>
    <!-- knowledge layer -->
    <g transform="translate(800 202)">
      <rect width="400" height="118" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ff6b8b" stroke-opacity="0.7" stroke-width="2"/>
      <text x="24" y="38" fill="#ff6b8b" font-size="15" font-weight="700" letter-spacing="2">KNOWLEDGE LAYER</text>
      <text x="24" y="72" fill="#ffffff" font-size="26" font-weight="700">79 skills · 12 engines</text>
      <text x="24" y="100" fill="#c9c6e8" font-size="15">router → engine → discipline → genre</text>
      <!-- book stack -->
      <g>
        <rect x="336" y="22" width="40" height="8" rx="2" fill="#ff6b8b"/>
        <rect x="340" y="32" width="36" height="8" rx="2" fill="#ff6b8b" opacity="0.8"/>
        <rect x="334" y="42" width="42" height="8" rx="2" fill="#ff6b8b" opacity="0.6"/>
      </g>
    </g>
  </g>
</svg>
